<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salary Budget Manager</title>
<style>
:root{--ink:#0b1420;--panel:#101c2c;--line:#1d2d44;--text:#d6e2ef;--muted:#8aa0b8;--cyan:#22d3ee;--blue:#4f6fe0;--grad:linear-gradient(135deg,#22d3ee,#4f6fe0);--bad:#f87171}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;padding:24px 16px 48px}
main{max-width:760px;margin:0 auto}
h1{font-weight:300;font-size:2rem;letter-spacing:.04em;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:var(--muted);margin:4px 0 22px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px}
h2{font-size:1.05rem;font-weight:500;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{padding:14px;border:1px solid var(--line);border-radius:12px}
.stat small{color:var(--muted);display:block}.stat b{font-size:1.35rem}.stat.main b{color:var(--cyan)}.neg b{color:var(--bad)!important}
form{display:grid;grid-template-columns:2fr 1fr 1.2fr auto;gap:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;color:var(--muted);font-size:.9rem;margin-bottom:4px}
input,select,button{font:inherit;color:var(--text);background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}
button{cursor:pointer;width:auto}button.go{background:var(--grad);color:var(--ink);border:0;font-weight:600}
ul{list-style:none}li{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
li small{color:var(--muted);display:block}li button{padding:4px 10px;font-size:.85rem}
.bar{margin-bottom:10px}.bar div{height:8px;border-radius:99px;background:var(--grad)}.bar span{display:flex;justify-content:space-between;font-size:.92rem}
.empty{color:var(--muted)}
@media(max-width:640px){form{grid-template-columns:1fr 1fr}form button{grid-column:1/-1;width:100%}}
</style></head><body><main>
<h1>Salary Budget Manager</h1>
<p class="sub">Plan your month the day your salary lands. Your data stays in this browser.</p>

<section class="panel"><h2>Your month</h2>
<div class="row2">
<div><label for="salary">Salary after tax (R)</label><input id="salary" type="number" min="0" step="0.01" inputmode="decimal"></div>
<div><label for="goal">Save each month (% of salary)</label><input id="goal" type="number" min="0" max="100" step="1" inputmode="numeric"></div>
</div></section>

<section class="panel"><div class="stats" id="stats"></div></section>

<section class="panel"><h2>Add an expense</h2>
<form id="f">
<div><label for="n">What for</label><input id="n" required maxlength="40" placeholder="e.g. Taxi fare"></div>
<div><label for="a">Amount (R)</label><input id="a" type="number" min="0.01" step="0.01" required inputmode="decimal"></div>
<div><label for="c">Category</label><select id="c"></select></div>
<button class="go" type="submit" style="align-self:end">Add</button>
</form></section>

<section class="panel"><h2>Where it went</h2><div id="cats"></div></section>
<section class="panel"><h2>Expenses</h2><ul id="list"></ul>
<p style="margin-top:14px"><button id="reset" type="button">Start a new month</button></p></section>
</main>
<script>
(function(){
var KEY="sm-money-v1",CATS=["Rent","Groceries","Transport","Airtime and data","Debt","Fun","Other"];
var S={salary:0,goal:10,items:[]};
try{var r=JSON.parse(localStorage.getItem(KEY));if(r&&Array.isArray(r.items))S=r}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function $(i){return document.getElementById(i)}
function R(n){return "R"+n.toLocaleString("en-ZA",{minimumFractionDigits:2,maximumFractionDigits:2})}
function el(t,txt,cls){var e=document.createElement(t);if(txt!=null)e.textContent=txt;if(cls)e.className=cls;return e}
CATS.forEach(function(c){var o=el("option",c);o.value=c;$("c").appendChild(o)});
$("salary").value=S.salary||"";$("goal").value=S.goal;
$("salary").oninput=function(){S.salary=parseFloat(this.value)||0;save();draw()};
$("goal").oninput=function(){S.goal=Math.min(100,Math.max(0,parseFloat(this.value)||0));save();draw()};
$("f").onsubmit=function(e){e.preventDefault();
 var a=parseFloat($("a").value);if(!(a>0))return;
 S.items.unshift({id:Date.now(),n:$("n").value.trim(),a:a,c:$("c").value,d:new Date().toISOString().slice(0,10)});
 this.reset();save();draw();$("n").focus()};
$("reset").onclick=function(){if(confirm("Clear all expenses and start a new month? Your salary and savings goal stay.")){S.items=[];save();draw()}};
function draw(){
 var spent=S.items.reduce(function(t,i){return t+i.a},0),goal=S.salary*S.goal/100,left=S.salary-spent-goal;
 var now=new Date(),days=new Date(now.getFullYear(),now.getMonth()+1,0).getDate()-now.getDate()+1;
 var st=$("stats");st.textContent="";
 [["Left to spend",left,"main"],["Spent so far",spent,""],["Savings goal",goal,""],["Safe to spend per day",Math.max(left,0)/days,""]].forEach(function(x){
  var d=el("div",null,"stat "+x[2]+(x[0]==="Left to spend"&&left<0?" neg":""));d.appendChild(el("small",x[0]));d.appendChild(el("b",R(x[1])));st.appendChild(d)});
 var cats=$("cats");cats.textContent="";
 if(!spent)cats.appendChild(el("p","Add an expense to see your spending by category.","empty"));
 CATS.forEach(function(c){var t=S.items.filter(function(i){return i.c===c}).reduce(function(s,i){return s+i.a},0);if(!t)return;
  var b=el("div",null,"bar"),s=el("span");s.appendChild(el("span",c));s.appendChild(el("span",R(t)+" ("+Math.round(t/spent*100)+"%)"));
  var g=el("div");g.style.width=Math.round(t/spent*100)+"%";b.appendChild(s);b.appendChild(g);cats.appendChild(b)});
 var ul=$("list");ul.textContent="";
 if(!S.items.length)ul.appendChild(el("p","No expenses yet.","empty"));
 S.items.forEach(function(i){var li=el("li"),w=el("div");w.appendChild(el("span",i.n));w.appendChild(el("small",i.c+" · "+i.d));
  var r=el("div");r.appendChild(el("b",R(i.a)+" "));var b=el("button","Delete");b.setAttribute("aria-label","Delete "+i.n);
  b.onclick=function(){S.items=S.items.filter(function(x){return x.id!==i.id});save();draw()};
  r.appendChild(b);li.appendChild(w);li.appendChild(r);ul.appendChild(li)});
}
draw();
})();
</script></body></html>
